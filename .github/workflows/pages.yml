name: Publish documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Assemble the documentation
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site

          if [[ ! -f docs/index.html ]]; then
            echo "::error::master ne contient pas docs/index.html."
            exit 1
          fi

          if [[ "$(find docs -type l -printf x -quit)" == "x" ]]; then
            echo "::error::master contient un lien symbolique dans docs."
            exit 1
          fi

          mkdir -p _site
          cp -a docs/. _site/

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
